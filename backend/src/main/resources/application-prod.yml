# PROD/DEMO profile - everything sensitive comes from environment variables.
# No admin/admin seed here (contexts != local). Never commit real values.
spring:
  datasource:
    url: ${DATABASE_URL}             # e.g. Supabase: jdbc:postgresql://aws-...pooler.supabase.com:6543/postgres
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  liquibase:
    contexts: prod
  mail:
    host: ${SMTP_HOST}               # Brevo: smtp-relay.brevo.com
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

bookaura:
  security:
    jwt-secret: ${JWT_SECRET}
    refresh-cookie-secure: true
  frontend-url: ${FRONTEND_URL}
