  - include:
      file: db/changelog/changesets/0005-revoked-access-tokens.yaml
  - include:
      file: db/changelog/changesets/0006-otp-tokens.yaml
  - include:
      file: db/changelog/changesets/0007-seed-roles.yaml
  - include:
      file: db/changelog/changesets/0008-catalog-schema.yaml
  - include:
      file: db/changelog/changesets/0009-loans.yaml
  - include:
      file: db/changelog/changesets/0010-system-configuration.yaml
  - include:
      file: db/changelog/changesets/0011-google-oauth.yaml
