spring:
  application:
    name: bookaura
  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase is the only schema owner (D11)
    open-in-view: false         # force explicit fetching, no lazy loading in views
    properties:
      hibernate:
        default_batch_fetch_size: 50  # bounded pages: batch lazy to-one/collections, avoid N+1
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 5MB       # service enforces STRICTLY below 5 MiB
      max-request-size: 6MB    # allows multipart envelope overhead

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health        # only health is exposed (maintenance-mode whitelist)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

bookaura:
  security:
    jwt-secret: ${JWT_SECRET:}              # MUST be >= 32 bytes; empty -> startup fails outside local/test
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    refresh-cookie-name: bookaura_refresh
    refresh-cookie-secure: true             # overridden to false only in local
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
